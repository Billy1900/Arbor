apiVersion: v1
kind: Secret
metadata:
  name: {{ include "arbor.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arbor.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "api.config.databaseUrl is required" .Values.api.config.databaseUrl | quote }}
  ATTACH_TOKEN_SECRET: {{ .Values.api.config.attachTokenSecret | quote }}
